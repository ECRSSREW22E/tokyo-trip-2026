    <section class="screen-hero"><div class="shell"><div class="eyebrow">作品場景巡禮・東京 2026</div><h1><span>沿著作品，</span><span>重新看見城市。</span></h1><p>從作品開始，再找到同一地點的所有場景。33 部動畫、日劇與日本電影，以官方、製作方、外景協拍單位和可核對的社群證據分層。停留時間與正式動線一律採用《日本行.docx》；未列入原行程的地點只顯示為可選支線。</p></div></section>
