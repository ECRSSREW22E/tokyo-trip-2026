<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="依東京六日行程整理的動漫、日劇與日本電影聖地巡禮資料庫；分清正式取景、官方合作與社群辨識。">
  <title>Screen Pilgrimage V2｜東京六天五夜</title>
  <link rel="stylesheet" href="../style.css?v=10">
  <link rel="stylesheet" href="../assets/screen-locations.css?v=2">
</head>
<body>
  <header class="topbar"><div class="shell nav"><a class="brand" href="../index.html">TOKYO 2026</a><nav class="day-nav" aria-label="主要頁面"><a href="../day1.html">D1</a><a href="../day2.html">D2</a><a href="../day3.html">D3</a><a href="../day4.html">D4</a><a href="../day5.html">D5</a><a href="../day6.html">D6</a><a href="../destinations/index.html">景點</a><a class="active" href="index.html">主題</a><a href="../sources/index.html">來源</a><a href="../checklist/index.html">清單</a></nav></div></header>
  <main data-screen-app>
    <section class="screen-hero"><div class="shell"><div class="eyebrow">SCREEN PILGRIMAGE / TOKYO 2026</div><h1>沿著作品，<br>重新看見城市。</h1><p>從作品開始，再找到同一地點的所有場景。33 部動漫、日劇與日本電影，以官方、製作方、Film Commission 和可核對的社群證據分層；不把合作裝置或視覺聯想誤寫成正式取景。</p></div></section>
    <section class="screen-app"><div class="shell">
      <div class="screen-controls" data-screen-controls>
        <div class="screen-type-row" role="group" aria-label="媒體類型"><button type="button" data-type="all" aria-pressed="true">ALL</button><button type="button" data-type="anime" aria-pressed="false">ANIME</button><button type="button" data-type="drama" aria-pressed="false">DRAMA</button><button type="button" data-type="movie" aria-pressed="false">MOVIE</button></div>
        <div class="screen-filter-grid">
          <label for="screen-work">WORK<select id="screen-work" data-state="work"><option value="all">所有作品</option></select></label>
          <label for="screen-area">AREA<select id="screen-area" data-state="area"><option value="all">所有地區</option><option value="kameari">龜有</option><option value="odaiba">台場</option><option value="shinjuku">新宿・四谷</option><option value="ikebukuro">池袋</option><option value="akihabara">秋葉原・神田</option><option value="roppongi">六本木・芝公園</option><option value="kamakura">鎌倉・七里濱</option><option value="enoshima">江之島</option><option value="atami">熱海</option><option value="shibuya">澀谷</option><option value="setagaya">世田谷</option><option value="yokohama">橫濱</option><option value="asakusa">淺草</option><option value="ueno">上野</option></select></label>
          <label for="screen-day">DAY<select id="screen-day" data-state="day"><option value="all">D1–D6</option><option>D1</option><option>D2</option><option>D3</option><option>D4</option><option>D5</option><option>D6</option></select></label>
          <label for="screen-evidence">EVIDENCE<select id="screen-evidence" data-state="evidence"><option value="all">全部證據</option><option value="verified">官方／已驗證</option><option value="match">高度吻合</option><option value="community">社群共識</option><option value="reference">僅供參考</option></select></label>
          <label for="screen-route">ROUTE<select id="screen-route" data-state="route"><option value="all">所有動線</option><option value="DIRECT">順路</option><option value="NEARBY">附近</option><option value="SMALL_DETOUR">短支線</option><option value="OPTIONAL_DETOUR">可選支線</option><option value="SPECIAL_TRIP">專程前往</option></select></label>
          <label for="screen-location-type">LOCATION<select id="screen-location-type" data-state="locationType"><option value="all">所有類型</option><option>STREET</option><option>INTERSECTION</option><option>STAIRS</option><option>BRIDGE</option><option>STATION</option><option>STATION_EXIT</option><option>PEDESTRIAN_BRIDGE</option><option>PARK</option><option>TEMPLE</option><option>MUSEUM</option><option>BUILDING</option><option>OBSERVATORY</option><option>BEACH</option><option>WATERFRONT</option><option>SHOPPING_STREET</option><option>OTHER</option></select></label>
        </div>
        <div class="screen-filter-footer"><strong data-screen-count>載入作品資料中…</strong><button type="button" data-reset>RESET FILTERS</button></div>
      </div>
      <div class="screen-results" data-screen-results aria-live="polite"></div>
    </div></section>
    <dialog class="screen-dialog" id="screen-location-dialog" aria-labelledby="screen-dialog-title"><div class="screen-dialog-inner" data-dialog-content></div></dialog>
  </main>
  <footer class="footer"><div class="shell">公共空間也有居民與通勤者。不要進入車道、軌道、私人土地，不移動物件，也不為重現場景阻塞動線。</div></footer>

</html>
